name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# 最小权限：工作流只需要读仓库内容（issue: Sourcery 供应链加固建议）
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # 第三方 action 全部固定到 40 位 commit SHA：
      # tag / 分支是可变的，SHA 不可变，避免上游被篡改后在我们的 CI 里执行任意代码。
      # 版本号写在行尾注释里；升级用 Dependabot（.github/dependabot.yml）自动提 PR。
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: easytaskmgr-jars
          path: build/libs/*.jar
