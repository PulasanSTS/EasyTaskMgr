pluginManagement {
	repositories {
		// 国内镜像：反向代理 maven.fabricmc.net（本机直连会卡在 TLS 握手）。
		// 官方地址放在后面兜底：GitHub Actions 等海外网络走官方，
		// Gradle 会按顺序使用第一个能解析到该构件的仓库。
		maven {
			name = 'FabricMirror'
			url = 'https://repository.hanbings.io/proxy/'
		}
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

// 与 fabric.mod.json 里的 mod id 保持一致
rootProject.name = 'easytaskmgr'
