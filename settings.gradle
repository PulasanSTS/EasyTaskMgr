pluginManagement {
	repositories {
		// 顺序很重要：
		// 1) Maven Central 放第一位——CI 上镜像对 gson/asm 等构件会 404，
		//    而 Gradle 遇到 404 会继续尝试下一个仓库；
		// 2) 镜像排第二，本机直连 maven.fabricmc.net 不稳定时由它提供 Fabric 构件；
		// 3) 官方 Fabric 与 Mojang 库兜底；4) 插件门户。
		mavenCentral()
		maven {
			name = 'FabricMirror'
			url = 'https://repository.hanbings.io/proxy/'
		}
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven {
			name = 'MinecraftLibraries'
			url = 'https://libraries.minecraft.net/'
		}
		gradlePluginPortal()
	}
}

// 与 fabric.mod.json 里的 mod id 保持一致
rootProject.name = 'easytaskmgr'
