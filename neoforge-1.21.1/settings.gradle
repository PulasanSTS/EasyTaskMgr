pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    // 只使用下面这组仓库，忽略插件自行添加的仓库（maven.neoforged.net 在本机不可达）
    repositoriesMode = RepositoriesMode.PREFER_SETTINGS
    repositories {
        // minecraft-dependencies 只发布在 maven.neoforged.net（本机不可达），
        // 这里用官方 1.21.1 版本清单生成了一份等价 POM 放在 local-maven/ 里
        maven {
            name = 'LocalMinecraftDependencies'
            url = uri("${rootDir}/local-maven")
        }
        // 官方 Maven 的 CDN 镜像（maven.neoforged.net 被本机网络污染，用这个走通）
        maven {
            name = 'NeoForgedCDN'
            url = 'https://neoforged.forgecdn.net/releases/'
        }
        maven {
            name = 'MinecraftLibraries'
            url = 'https://libraries.minecraft.net/'
        }
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
        mavenCentral()
    }
}

rootProject.name = 'easytaskmgr-neoforge'
