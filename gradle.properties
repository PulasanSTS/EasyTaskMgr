# ---------------------------------------------------------------------------
# Gradle
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# 本项目固定用 JDK 25 构建（Minecraft 26.3 的 class 版本是 69，即 Java 25）。
# 本机已装：D:\Program Files\Jdk\zulu25.32.21-ca-jdk25.0.2-win_x64
# 换机器 / 换 JDK 时改这一行即可。
org.gradle.java.home=D:/Program Files/Jdk/zulu25.32.21-ca-jdk25.0.2-win_x64

# ---------------------------------------------------------------------------
# Fabric（对应 Minecraft 26.3，来源：https://fabricmc.net/develop）
# ---------------------------------------------------------------------------
minecraft_version=26.3
loader_version=0.20.1
loom_version=1.19-SNAPSHOT
fabric_api_version=0.165.0+26.3

# Loom 自己下载 Fabric 依赖（intermediary / named jar 等）时也走国内镜像。
# 直连 maven.fabricmc.net 时 TLS 会被中断，构建会卡住。
loom_fabric_repository=https://repository.hanbings.io/proxy/

# ---------------------------------------------------------------------------
# Mod 元信息（会被 build.gradle 写进 fabric.mod.json）
# ---------------------------------------------------------------------------
version=1.0.0-beta.1
group=com.easytaskmgr
