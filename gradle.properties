# ---------------------------------------------------------------------------
# Gradle
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# 本工程需要 JDK 25（Minecraft 26.3 的 class 版本是 69）。
# 注意：不要在这里写 org.gradle.java.home——那是本机绝对路径，会让 GitHub Actions 的
# Linux 构建直接失败（"Java home supplied is invalid"）。
# 本机通过 JAVA_HOME 指向 JDK 25 即可；CI 由 actions/setup-java 提供。

# ---------------------------------------------------------------------------
# Fabric（对应 Minecraft 26.3，来源：https://fabricmc.net/develop）
# ---------------------------------------------------------------------------
minecraft_version=26.3
loader_version=0.20.1
loom_version=1.19-SNAPSHOT
fabric_api_version=0.165.0+26.3

# Loom 自己下载 Fabric 依赖（intermediary / named jar 等）走镜像：
# 本机直连 maven.fabricmc.net 会失败（Gradle 对连接错误不会回退到下一个仓库）。
# CI 上镜像可访问，若镜像缺件则回落到项目仓库里的官方 Fabric Maven。
loom_fabric_repository=https://repository.hanbings.io/proxy/

# ---------------------------------------------------------------------------
# Mod 元信息（会被 build.gradle 写进 fabric.mod.json）
# ---------------------------------------------------------------------------
version=1.0.0-beta.3
group=com.easytaskmgr
